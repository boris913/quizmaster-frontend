name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valeurs factices : le build ne doit dépendre d'aucun secret.
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_WS_URL: ws://localhost:3001
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Tests e2e (hors @backend)
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Image Docker (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build seul, aucun push vers un registre. Valeurs NEXT_PUBLIC_* factices.
      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kwizora-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.test
            NEXT_PUBLIC_WS_URL=https://api.example.test
            NEXT_PUBLIC_APP_URL=https://app.example.test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test du conteneur
        run: |
          docker run -d --name kwizora-ci -p 3000:3000 kwizora-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://localhost:3000/
          test "$(docker exec kwizora-ci id -u)" != "0"

      - name: Statut du HEALTHCHECK
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kwizora-ci)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs kwizora-ci
          exit 1

      - name: Logs du conteneur
        if: failure()
        run: docker logs kwizora-ci || true
